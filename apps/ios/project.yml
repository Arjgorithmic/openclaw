name: Kibo
options:
  bundleIdPrefix: ai.kibo
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_APP_INTENTS_METADATA_GENERATION: NO

packages:
  KiboKit:
    path: ../shared/KiboKit
  Swabble:
    path: ../../Swabble

schemes:
  Kibo:
    shared: true
    build:
      targets:
        Kibo: all
    test:
      targets:
        - KiboTests
        - KiboLogicTests
  KiboLogicTests:
    shared: true
    build:
      targets:
        KiboLogicTests: all
    test:
      targets:
        - KiboLogicTests

targets:
  Kibo:
    type: application
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: Sources
    dependencies:
      - target: KiboShareExtension
        embed: true
      - target: KiboActivityWidget
        embed: true
      - target: KiboWatchApp
      - package: KiboKit
      - package: KiboKit
        product: KiboChatUI
      - package: KiboKit
        product: KiboProtocol
      - package: Swabble
        product: SwabbleKit
      - sdk: AppIntents.framework
    preBuildScripts:
      - name: SwiftFormat (lint)
        basedOnDependencyAnalysis: false
        inputFileLists:
          - $(SRCROOT)/SwiftSources.input.xcfilelist
        script: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          if ! command -v swiftformat >/dev/null 2>&1; then
            echo "error: swiftformat not found (brew install swiftformat)" >&2
            exit 1
          fi
          swiftformat --lint --config "$SRCROOT/../../.swiftformat" \
            --filelist "$SRCROOT/SwiftSources.input.xcfilelist"
      - name: SwiftLint
        basedOnDependencyAnalysis: false
        inputFileLists:
          - $(SRCROOT)/SwiftSources.input.xcfilelist
        script: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          if ! command -v swiftlint >/dev/null 2>&1; then
            echo "error: swiftlint not found (brew install swiftlint)" >&2
            exit 1
          fi
          swiftlint lint --config "$SRCROOT/.swiftlint.yml" --use-script-input-file-lists
    settings:
      base:
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_ENTITLEMENTS: Sources/Kibo.entitlements
        CODE_SIGN_STYLE: "$(KIBO_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(KIBO_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(KIBO_APP_BUNDLE_ID)"
        PROVISIONING_PROFILE_SPECIFIER: "$(KIBO_APP_PROFILE)"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SUPPORTS_LIVE_ACTIVITIES: YES
        ENABLE_APPINTENTS_METADATA: NO
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
      configs:
        Debug:
          KIBO_PUSH_TRANSPORT: direct
          KIBO_PUSH_DISTRIBUTION: local
          KIBO_PUSH_RELAY_BASE_URL: ""
          KIBO_PUSH_APNS_ENVIRONMENT: sandbox
        Release:
          KIBO_PUSH_TRANSPORT: direct
          KIBO_PUSH_DISTRIBUTION: local
          KIBO_PUSH_RELAY_BASE_URL: ""
          KIBO_PUSH_APNS_ENVIRONMENT: production
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Kibo
        CFBundleIconName: AppIcon
        CFBundleURLTypes:
          - CFBundleURLName: ai.kibo.ios
            CFBundleURLSchemes:
              - kibo
        CFBundleShortVersionString: "$(KIBO_MARKETING_VERSION)"
        KiboCanonicalVersion: "$(KIBO_IOS_VERSION)"
        CFBundleVersion: "$(KIBO_BUILD_VERSION)"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes:
          - audio
          - remote-notification
        BGTaskSchedulerPermittedIdentifiers:
          - ai.kibo.ios.bgrefresh
        NSLocalNetworkUsageDescription: Kibo discovers and connects to your Kibo gateway on the local network.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
        NSBonjourServices:
          - _kibo-gw._tcp
        NSCameraUsageDescription: Kibo can capture photos or short video clips when requested via the gateway.
        NSLocationWhenInUseUsageDescription: Kibo uses your location when you allow location sharing.
        NSLocationAlwaysAndWhenInUseUsageDescription: Kibo can share your location in the background when you enable Always.
        NSMicrophoneUsageDescription: Kibo needs microphone access for voice wake.
        NSMotionUsageDescription: Kibo may use motion data to support device-aware interactions and automations.
        NSPhotoLibraryUsageDescription: Kibo needs photo library access when you choose existing photos to share with your assistant.
        NSSpeechRecognitionUsageDescription: Kibo uses on-device speech recognition for voice wake.
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
        KiboPushTransport: "$(KIBO_PUSH_TRANSPORT)"
        KiboPushDistribution: "$(KIBO_PUSH_DISTRIBUTION)"
        KiboPushRelayBaseURL: "$(KIBO_PUSH_RELAY_BASE_URL)"
        KiboPushAPNsEnvironment: "$(KIBO_PUSH_APNS_ENVIRONMENT)"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  KiboShareExtension:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: ShareExtension
    dependencies:
      - package: KiboKit
      - sdk: AppIntents.framework
    settings:
      base:
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: "$(KIBO_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(KIBO_DEVELOPMENT_TEAM)"
        ENABLE_APPINTENTS_METADATA: NO
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        PRODUCT_BUNDLE_IDENTIFIER: "$(KIBO_SHARE_BUNDLE_ID)"
        PROVISIONING_PROFILE_SPECIFIER: "$(KIBO_SHARE_PROFILE)"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Kibo Share
        CFBundleShortVersionString: "$(KIBO_MARKETING_VERSION)"
        CFBundleVersion: "$(KIBO_BUILD_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsMovieWithMaxCount: 1

  KiboActivityWidget:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: ActivityWidget
      - path: Sources/LiveActivity/KiboActivityAttributes.swift
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: ActivityKit.framework
    settings:
      base:
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: "$(KIBO_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(KIBO_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(KIBO_ACTIVITY_WIDGET_BUNDLE_ID)"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SUPPORTS_LIVE_ACTIVITIES: YES
    info:
      path: ActivityWidget/Info.plist
      properties:
        CFBundleDisplayName: Kibo Activity
        CFBundleShortVersionString: "$(KIBO_MARKETING_VERSION)"
        CFBundleVersion: "$(KIBO_BUILD_VERSION)"
        NSSupportsLiveActivities: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  KiboWatchApp:
    type: application.watchapp2
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: WatchApp
    dependencies:
      - target: KiboWatchExtension
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    attributes:
      DevelopmentTeam: "$(KIBO_DEVELOPMENT_TEAM)"
      ProvisioningStyle: "$(KIBO_CODE_SIGN_STYLE)"
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: "$(KIBO_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(KIBO_DEVELOPMENT_TEAM)"
        ENABLE_APPINTENTS_METADATA: NO
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        PRODUCT_BUNDLE_IDENTIFIER: "$(KIBO_WATCH_APP_BUNDLE_ID)"
        PROVISIONING_PROFILE_SPECIFIER: "$(KIBO_WATCH_APP_PROFILE)"
    info:
      path: WatchApp/Info.plist
      properties:
        CFBundleDisplayName: Kibo
        CFBundleShortVersionString: "$(KIBO_MARKETING_VERSION)"
        CFBundleVersion: "$(KIBO_BUILD_VERSION)"
        WKCompanionAppBundleIdentifier: "$(KIBO_APP_BUNDLE_ID)"
        WKWatchKitApp: true

  KiboWatchExtension:
    type: watchkit2-extension
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: WatchExtension/Sources
    dependencies:
      - sdk: AppIntents.framework
      - sdk: WatchConnectivity.framework
      - sdk: UserNotifications.framework
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    attributes:
      DevelopmentTeam: "$(KIBO_DEVELOPMENT_TEAM)"
      ProvisioningStyle: "$(KIBO_CODE_SIGN_STYLE)"
    settings:
      base:
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: "$(KIBO_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(KIBO_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(KIBO_WATCH_EXTENSION_BUNDLE_ID)"
        PROVISIONING_PROFILE_SPECIFIER: "$(KIBO_WATCH_EXTENSION_PROFILE)"
    info:
      path: WatchExtension/Info.plist
      properties:
        CFBundleDisplayName: Kibo
        CFBundleShortVersionString: "$(KIBO_MARKETING_VERSION)"
        CFBundleVersion: "$(KIBO_BUILD_VERSION)"
        NSExtension:
          NSExtensionAttributes:
            WKAppBundleIdentifier: "$(KIBO_WATCH_APP_BUNDLE_ID)"
          NSExtensionPointIdentifier: com.apple.watchkit

  KiboTests:
    type: bundle.unit-test
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: Tests
        excludes:
          - Logic
    dependencies:
      - target: Kibo
      - package: Swabble
        product: SwabbleKit
      - sdk: AppIntents.framework
    settings:
      base:
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: "$(KIBO_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(KIBO_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: ai.kibo.ios.tests
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Kibo.app/Kibo"
        BUNDLE_LOADER: "$(TEST_HOST)"
    info:
      path: Tests/Info.plist
      properties:
        CFBundleDisplayName: KiboTests
        CFBundleShortVersionString: "$(KIBO_MARKETING_VERSION)"
        CFBundleVersion: "$(KIBO_BUILD_VERSION)"

  KiboLogicTests:
    type: bundle.unit-test
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: Tests/Logic
    dependencies:
      - package: KiboKit
    settings:
      base:
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: "$(KIBO_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(KIBO_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: ai.kibo.ios.logic-tests
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
    info:
      path: Tests/Info.plist
      properties:
        CFBundleDisplayName: KiboLogicTests
        CFBundleShortVersionString: "$(KIBO_MARKETING_VERSION)"
        CFBundleVersion: "$(KIBO_BUILD_VERSION)"
