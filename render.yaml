services:
  - type: web
    name: kibo
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: KIBO_GATEWAY_PORT
        value: "8080"
      - key: KIBO_STATE_DIR
        value: /data/.kibo
      - key: KIBO_WORKSPACE_DIR
        value: /data/workspace
      - key: KIBO_GATEWAY_TOKEN
        generateValue: true
    disk:
      name: kibo-data
      mountPath: /data
      sizeGB: 1
